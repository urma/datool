[package]
name = "datool"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
walkdir = "2"
roxmltree = "0.18"
sha2 = "0.10"
rayon = "1.10"
hex = "0.4"
crc32fast = "1.4"
md5 = "0.8"
magic = "0.17"
unarc-rs = "0.8"
zip = "2"
sevenz-rust2 = { version = "0.27", default-features = false, features = ["compress"] }
tempfile = "3"
